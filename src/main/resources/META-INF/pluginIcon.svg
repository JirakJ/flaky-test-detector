<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
    <!-- Background -->
    <rect width="40" height="40" rx="8" fill="#1565C0"/>
    <!-- Test tube body -->
    <rect x="14" y="7" width="12" height="22" rx="2" fill="#42A5F5"/>
    <!-- Test tube bottom round -->
    <ellipse cx="20" cy="29" rx="6" ry="4" fill="#42A5F5"/>
    <!-- Liquid in tube -->
    <rect x="14" y="18" width="12" height="11" fill="#66BB6A"/>
    <ellipse cx="20" cy="29" rx="6" ry="4" fill="#66BB6A"/>
    <!-- Bubbles -->
    <circle cx="17" cy="22" r="1.5" fill="#A5D6A7" opacity="0.7"/>
    <circle cx="22" cy="25" r="1" fill="#A5D6A7" opacity="0.7"/>
    <!-- Test tube rim -->
    <rect x="13" y="5.5" width="14" height="3" rx="1.5" fill="#90CAF9"/>
    <!-- Warning badge -->
    <circle cx="33" cy="9" r="6" fill="#FF9800"/>
    <!-- Exclamation mark as path (not text) -->
    <rect x="32" y="5.5" width="2" height="4.5" rx="1" fill="#FFFFFF"/>
    <circle cx="33" cy="12" r="1" fill="#FFFFFF"/>
</svg>
