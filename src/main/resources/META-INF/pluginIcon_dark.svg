<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <!-- Test tube body -->
  <rect x="14" y="6" width="12" height="24" rx="2" fill="#1E88E5" stroke="#64B5F6" stroke-width="1.5"/>
  <!-- Test tube bottom round -->
  <ellipse cx="20" cy="30" rx="6" ry="4" fill="#1E88E5" stroke="#64B5F6" stroke-width="1.5"/>
  <!-- Liquid in tube -->
  <rect x="14" y="18" width="12" height="12" fill="#2E7D32"/>
  <ellipse cx="20" cy="30" rx="6" ry="4" fill="#2E7D32"/>
  <!-- Bubbles -->
  <circle cx="17" cy="22" r="1.5" fill="#4CAF50" opacity="0.7"/>
  <circle cx="22" cy="25" r="1" fill="#4CAF50" opacity="0.7"/>
  <!-- Test tube rim -->
  <rect x="13" y="5" width="14" height="3" rx="1" fill="#1565C0" stroke="#64B5F6" stroke-width="1"/>
  <!-- Warning badge -->
  <circle cx="33" cy="8" r="6" fill="#E65100"/>
  <text x="33" y="11" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="bold" fill="white">!</text>
</svg>
